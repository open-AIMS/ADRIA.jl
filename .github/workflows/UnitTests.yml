name: UnitTests
on:
  # Trigger manually, on version tags, or on main when packages updated. The main run
  # seeds the cache that every PR starts from: GitHub only lets a PR restore caches saved
  # on its own ref or on the default branch.
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'ADRIA/Manifest-v1.12.toml'
      - '.github/workflows/UnitTests.yml'
  # Run in PR when packages updated.
  # NOTE: PRs are only tested when the manifest changes, so ordinary PRs that touch
  # ADRIA/src do NOT run these jobs (including the precompile budget test in the `fast`
  # shard); that is only checked on version tags, manual dispatch, manifest changes or
  # via the opt-in .githooks/pre-push hook. Widening the trigger is a cost decision.
  pull_request:
    paths:
      - 'ADRIA/Manifest-v1.12.toml'
      - '.github/workflows/UnitTests.yml'
  workflow_dispatch:

# Cancel superseded runs of the same ref so stale pushes don't burn minutes.
concurrency:
  group: unittests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the shared test environment (install + precompile) once and saves it to the
  # cache, so the three shards below start from a warm depot instead of each doing the
  # cold build in parallel inside a tight limit. It has a generous limit because a cold
  # build is slow; it is quick when the cache is warm.
  setup:
    name: setup - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        version: ["1.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: adria-setup-cache
          include-matrix: false
      - name: Prepare test environment
        run: julia ADRIA/test/run_tests.jl --prepare-only
        env:
          ADRIA_TEST_COVERAGE: adria
      - name: Diagnose precompile cache
        # Prints why (if at all) .ji cache files of a few leaf packages are rejected.
        run: |
          julia -e 'using InteractiveUtils; versioninfo()'
          lscpu | grep "Model name"
          ls -la ADRIA/test/.testenv || true
          for p in RangeArrays ExprTools Reexport; do
            echo "=== using $p ==="
            JULIA_DEBUG=loading julia --project=ADRIA/test/.testenv --check-bounds=yes --code-coverage=@$PWD/ADRIA --startup-file=no -e "using $p" 2>&1 | grep -iE "Rejecting|Loading object cache|Precompiling|$p" | head -20 || true
          done
      - name: Save test environment
        # julia-actions/cache only handles the depot, so the resolved test environment
        # (Project + Manifest) is cached separately and shared with the shards.
        uses: actions/cache/save@v4
        with:
          path: ADRIA/test/.testenv
          key: adria-testenv-${{ github.run_id }}-${{ github.run_attempt }}

  test:
    needs: setup
    name: ${{ matrix.shard }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Limit for the whole job (checkout + cache + precompile + tests). This is a
    # GitHub-side hard limit that still works if the launcher itself is wedged. The
    # launcher separately enforces a per-shard limit on the test process only (see
    # ADRIA/test/run_tests.jl): 6 min for fast and 10 min for spec/sim, each tighter than
    # the job limits below, which also have to cover checkout and cache restore.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest]
        shard: [fast, spec, sim]
        include:
          # The `setup` job builds the cache, so these only cover restoring it plus the
          # tests. Measured on a warm cache (whole job): fast ~3 min, sim ~5.5 min, spec
          # ~6.5 min. Limits are roughly 2-3x those, to absorb runner variance without
          # letting a hung job run for an hour.
          - shard: fast
            timeout: 10
          - shard: spec
            timeout: 15
          - shard: sim
            timeout: 12
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: adria-setup-cache
          # Same key for every shard and for the setup job (the matrix values, including
          # the timeout, would otherwise be part of it and give each its own cache).
          include-matrix: false
      - name: Restore test environment from setup job
        id: testenv
        uses: actions/cache/restore@v4
        with:
          path: ADRIA/test/.testenv
          key: adria-testenv-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Diagnose precompile cache
        # Prints why (if at all) .ji cache files of a few leaf packages are rejected.
        run: |
          julia -e 'using InteractiveUtils; versioninfo()'
          lscpu | grep "Model name"
          ls -la ADRIA/test/.testenv || true
          for p in RangeArrays ExprTools Reexport; do
            echo "=== using $p ==="
            JULIA_DEBUG=loading julia --project=ADRIA/test/.testenv --check-bounds=yes --code-coverage=@$PWD/ADRIA --startup-file=no -e "using $p" 2>&1 | grep -iE "Rejecting|Loading object cache|Precompiling|$p" | head -20 || true
          done
      # The launcher uses the environment restored above (--no-prepare) and runs this shard
      # in a supervised subprocess with a hard per-shard kill limit., then runs this shard in a
      # supervised subprocess with a hard per-shard kill limit.
      - name: Run ${{ matrix.shard }} shard
        run: julia ADRIA/test/run_tests.jl --no-prepare ${{ matrix.shard }}
        env:
          # Launcher maps this to `--code-coverage=@<ADRIA dir>` (ADRIA sources only);
          # a plain `--code-coverage=user` would discard precompiled code of all deps.
          ADRIA_TEST_COVERAGE: adria
          # Use all available cores (4 on public-repo standard runners).
          JULIA_NUM_THREADS: auto
          JULIA_DEBUG: loading
      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.shard }}
          path: ADRIA/test/logs/
      - uses: julia-actions/julia-processcoverage@v1
        if: always()
        with:
          directories: ADRIA/src
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          verbose: true
          files: lcov.info
          flags: ${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}
