name: UnitTests
on:
  # Trigger manually or on version tags
  push:
    tags:
      - 'v*'
  # Run in PR when packages updated
  pull_request:
    paths:
      - 'ADRIA/Manifest-v1.12.toml'
  workflow_dispatch:

# Cancel superseded runs of the same ref so stale pushes don't burn minutes.
concurrency:
  group: unittests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.shard }} - Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Backstop for the whole job (checkout + cache + precompile + tests). This is
    # a GitHub-side hard limit that still works if the launcher itself is wedged.
    # The launcher separately enforces a tighter per-shard limit (see
    # ADRIA/test/run_tests.jl). Raised per shard in the matrix below.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.12"]
        os: [ubuntu-latest]
        shard: [fast, spec, sim]
        include:
          # `timeout-minutes: 5` is the target for the quick shards. It covers the whole
          # job, so it only holds with a warm depot cache; the first run after a
          # manifest change will need to rebuild the cache (re-run with a larger value
          # or via workflow_dispatch). The sim shard runs 32 simulations and needs more.
          - shard: fast
            timeout: 5
          - shard: spec
            timeout: 5
          - shard: sim
            timeout: 25
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: adria-setup-cache
      # The launcher prepares one shared test environment, then runs this shard in a
      # supervised subprocess with a hard per-shard kill limit.
      - name: Run ${{ matrix.shard }} shard
        run: julia ADRIA/test/run_tests.jl ${{ matrix.shard }}
        env:
          ADRIA_TEST_COVERAGE: user
      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.shard }}
          path: ADRIA/test/logs/
      - uses: julia-actions/julia-processcoverage@v1
        if: always()
        with:
          directories: ADRIA/src
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          verbose: true
          files: lcov.info
          flags: ${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}
